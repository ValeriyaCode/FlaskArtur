<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Main</title>
</head>
<body>

  <!--
    form - форма
    input - поле введення
    button - кнопка
    label - підказка біля input

    параметр placeholder - підказка всередені input
  -->

  <h3>Search:</h3>

  <form method="GET">
    <input name="search" type="text" placeholder="type request" required>
    <button type="submit">To search</button>
  </form>

  {% if search %}
    <p>You search: {{ search }}</p>
  {% endif %}

  <h3>Password:</h3>

  <!-- get_flashed_messages - повертає список flash-повідомлень -->
  {% for message in get_flashed_messages() %}
    <strong>{{ message }}</strong>
  {% endfor %}

  <form method="POST">
    <label for="user_password">Password:</label>
    <input name="password" type="password" id="user_password">
    <button type="submit">Send</button>
  </form>


  <!--
  table - таблиця
  caption - назва таблиці

  thead - шапка
  tbody - дані
  tfoot - підсумкові дані

  tr - ряд
  th - комірка з жирним текстом
  td - комірка зі звичайним текстом

  border - обводка
  cellpadding - відступ всередині комірок
  -->

  <table border="1" cellpadding="5">
      <caption>Table Test</caption>

      <thead>
        <tr>
          <th>Name</th>
          <th>Course</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Artur</td>
          <td>Python</td>
        </tr>

        <tr>
          <td>Lera</td>
          <td>Web</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <th>Total:</th>
          <th>2</th>
        </tr>
      </tfoot>
  </table>

</body>
</html>
